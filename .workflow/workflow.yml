version: "1.0"
  name: 构建
  displayName: 构建
  stages:
  - name: 构建
    displayName: 构建
    strategy: naturally
    trigger: auto
    steps:
    - step: build@android
      name: ""
      displayName: Android 构建
      jdkVersion: "17"
      gradleVersion: "8.14"
      buildToolsVersion: 35.0.0
      ndkVersion: 28.2.13676358
      commands:
      - 'if [ -n "${ANDROID_HOME:-}" ]; then echo "sdk.dir=$ANDROID_HOME" >
  local.properties; fi'
      - chmod +x gradlew
      - ./gradlew --no-daemon --stacktrace :app:assembleDebug
      artifacts:
      - name: BUILD_ARTIFACT
        path:
        - ./app/build/outputs/apk/debug
        type: .tar.gz
      caches:
      - "~/.gradle/caches"
      - "~/.gradle/wrapper"
      - "~/.android"
      strategy:
        retry: "0"
        resource:
          cpu: "2"
          memory: "4"
  triggers:
    trigger: manual
  notify: []
  strategy:
    blocking: true